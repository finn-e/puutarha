name: Deploy v5 to Subdirectory

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-v5:
    if: ${{ github.repository == 'finn-e/puutarha' }}
    runs-on: ubuntu-latest
    name: Build Quartz and Push to Subfolder
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Check types and style
        run: npm run check

      - name: Build Quartz
        run: npx quartz build -v

      - name: Deploy to finn-e.github.io Subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          repository-name: finn-e/finn-e.github.io
          token: ${{ secrets.FINNE_GITHUB_IO }}
          branch: gh-pages
          target-folder: puutarha
          clean: true
